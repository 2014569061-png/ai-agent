name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布 tag（如 v0.8.8）'
        required: true
        default: 'v0.8.8'

permissions:
  contents: write

env:
  EXPECTED_PACKAGE: com.nexusagent.app
  EXPECTED_ABI: arm64-v8a

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Inline Chinese gate
        run: bash tool/check_inline_zh.sh

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve release tag and pubspec version
        id: release
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_INPUT"
          version="$(awk '$1 == "version:" {print $2; exit}' pubspec.yaml)"
          test -n "$version"
          test "$tag" = "v${version%%+*}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_name=${version%%+*}" >> "$GITHUB_OUTPUT"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            test -n "${!name}" || { printf 'Missing required signing secret: %s\n' "$name"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --split-debug-info=build/symbols --obfuscate
      - name: Validate APK package, version, ABI, and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          apkanalyzer manifest application-id "$apk" | grep -Fx "$EXPECTED_PACKAGE"
          apkanalyzer manifest version-name "$apk" | grep -Fx "${{ steps.release.outputs.version_name }}"
          unzip -Z1 "$apk" | grep -Fx "lib/$EXPECTED_ABI/" >/dev/null || unzip -Z1 "$apk" | grep -Eq '^lib/arm64-v8a/[^/]+$'
          ! unzip -Z1 "$apk" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'
          apksigner verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          ! grep -Eiq 'CN=Android Debug|androiddebugkey' /tmp/apksigner.txt
      - name: Create SHA-256 sidecar
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/symbols/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
