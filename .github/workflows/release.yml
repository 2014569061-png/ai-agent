name: Build & Release Android and Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布 tag（如 v0.9）'
        required: true
        default: 'v0.9'

permissions:
  contents: write

env:
  EXPECTED_PACKAGE: com.nexusagent.app
  EXPECTED_ABI: arm64-v8a

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Silent catch ratchet
        run: dart run tool/count_silent_catches.dart lib 0
      - name: Release evidence and evaluation scorer regression
        run: |
          python3 tool/test_release_evidence_gate.py
          python3 tool/test_score_mobile_agent_eval.py
          python3 tool/test_source_tokens.py
      - name: Test with coverage
        run: flutter test --coverage
      - name: Coverage gate
        run: dart run tool/check_coverage.dart coverage/lcov.info 55.0
  windows:
    name: Publish Windows x64 package
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'
      - name: Build and package Windows
        shell: pwsh
        run: ./tool/build-windows.ps1
      - name: Build Windows installer
        shell: pwsh
        run: ./tool/build-windows-installer.ps1
      - name: Validate Windows package checksum
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist/windows -Filter 'nexus-agent-*-windows-x64.zip')
          if ($packages.Count -ne 1) { throw 'Expected exactly one Windows package' }
          $package = $packages[0]
          $sidecar = $package.FullName + '.sha256'
          $expected = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Windows package checksum mismatch' }
      - name: Upload Windows package to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: |
            dist/windows/nexus-agent-*-windows-x64.zip
            dist/windows/nexus-agent-*-windows-x64.zip.sha256
            dist/windows/nexus-agent-*-windows-x64-setup.exe
            dist/windows/nexus-agent-*-windows-x64-setup.exe.sha256
          fail_on_unmatched_files: true
  build:
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve release tag and application version
        id: release
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_INPUT"
          version="$(awk '$1 == "version:" {print $2; exit}' pubspec.yaml)"
          test -n "$version"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          full_tag="v$version_name"
          short_tag="v${version_name%.0}"
          if [ "$tag" != "$full_tag" ] && [ "$tag" != "$short_tag" ]; then
            printf 'Tag %s does not match %s or %s\n' "$tag" "$full_tag" "$short_tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            test -n "${!name}" || { printf 'Missing required signing secret: %s\n' "$name"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --split-debug-info=build/symbols --obfuscate
      - name: Validate APK package, version, ABI, and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          apkanalyzer manifest application-id "$apk" | grep -Fx "$EXPECTED_PACKAGE"
          apkanalyzer manifest version-name "$apk" | grep -Fx "${{ steps.release.outputs.version_name }}"
          unzip -Z1 "$apk" | grep -Fx "lib/$EXPECTED_ABI/" >/dev/null || unzip -Z1 "$apk" | grep -Eq '^lib/arm64-v8a/[^/]+$'
          ! unzip -Z1 "$apk" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'
          apksigner verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          ! grep -Eiq 'CN=Android Debug|androiddebugkey' /tmp/apksigner.txt
      - name: Create SHA-256 sidecar
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          sha256sum --check app-release.apk.sha256
      - name: Require reviewed mobile release evidence
        shell: bash
        run: |
          python3 tool/release_evidence_gate.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --evidence release/mobile-evidence.json \
            --output artifacts/project-review/mobile-release-gate.json
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/symbols/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
