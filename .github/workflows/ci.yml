name: CI

# 日常提交的质量门。
#
# 此前仓库只有 release.yml（触发条件仅为 push tag v*），也就是说：main/feature
# 分支的日常提交没有任何强制门禁，而 README/交接文档宣称的"flutter analyze 零
# 告警 + 测试全绿"只由开发者本机习惯保证。本工作流把同一组命令搬到 CI。
#
# 触发条件说明：日常开发分支是 feature/*（当前为 feature/mature-agent），因此
# 只挂 main 等于门禁形同虚设，故同时覆盖 feature/** 与所有 PR。
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Silent catch ratchet
        # 静默吞掉的异常在 Analyze 这一步是**看不见**的：`catch (error) {}` 会被
        # empty_catches 报出，但只要参数名写成下划线（`catch (_) {}`）就被豁免，
        # 而仓库里绝大多数站点恰好都用下划线。于是它们既没有日志也没有遥测，
        # 失败与成功在数据上不可区分，analyze 却是全绿。
        #
        # 这道门槛把「未记录意图的空 catch」数量卡在 0：任何新增都必须要么在
        # catch 体里写下为什么可以吞（即视为已记录意图），要么用
        # NexusGuard.degradeAsync / degradeCaught 接入诊断日志。门槛挡的是顺手
        # 吞掉，不是敷衍地吞掉 —— 97 处既有站点已逐条记录意图并通过本步骤。
        #
        # 扫描器自身在 test/count_silent_catches_test.dart 里有测试守护：如果它
        # 漏计，门槛会假装通过，所以判定器本身也需要被验证。
        run: dart run tool/count_silent_catches.dart lib 0

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage gate
        # 分母已排除生成代码（见 tool/check_coverage.dart）。作者代码实际覆盖率为
        # 56% 左右，门槛设 55% 留约 1 个点余量，让它成为真正的回归信号，
        # 而不是一个测试删掉一半代码都还能过的摆设。
        run: dart run tool/check_coverage.dart coverage/lcov.info 55.0

  android_build:
    name: Android debug build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64
