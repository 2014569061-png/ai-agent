<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Agent · 下载</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --ink: #1a1d27;
    --sub: #6b7280;
    --accent: #4f46e5;
    --accent-ink: #ffffff;
    --ok: #16a34a;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    max-width: 420px;
    width: 100%;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(16, 24, 40, 0.06);
  }
  .logo {
    width: 72px; height: 72px;
    border-radius: 18px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; color: #fff;
    margin: 0 auto 16px;
  }
  h1 { font-size: 24px; font-weight: 700; }
  .tagline { color: var(--sub); font-size: 14px; margin-top: 6px; }
  .features {
    text-align: left;
    margin: 20px 0;
    padding: 14px 16px;
    background: #fafbff;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    color: var(--sub);
  }
  .features li { list-style: none; padding: 3px 0; }
  .features li::before { content: "✓"; color: var(--ok); font-weight: 700; margin-right: 8px; }
  #dl-btn {
    display: block;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    font-size: 16px; font-weight: 600;
    padding: 14px 20px;
    border-radius: 12px;
    margin: 4px 0 8px;
    transition: opacity .15s;
  }
  #dl-btn:active { opacity: .85; }
  #dl-btn[disabled] { opacity: .5; cursor: default; }
  .ver { font-size: 12px; color: var(--sub); }
  .qr { margin: 20px auto 8px; width: 168px; height: 168px; }
  .qr img { width: 100%; height: 100%; display: block; border-radius: 10px; border: 1px solid var(--border); }
  .qr-tip { font-size: 12px; color: var(--sub); }
  .steps {
    text-align: left;
    margin: 20px 0 0;
    font-size: 13px;
    color: var(--sub);
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .steps b { color: var(--ink); }
  .steps ol { margin-left: 18px; }
  .steps li { margin: 6px 0; }
  footer { margin-top: 16px; font-size: 12px; color: #9ca3af; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">N</div>
    <h1>NEXUS Agent</h1>
    <p class="tagline">移动端 AI Agent 聚合客户端</p>

    <ul class="features">
      <li>一个 App 接入主流大模型</li>
      <li>危险操作强制人工审批</li>
      <li>聊天记录只存本地</li>
    </ul>

    <a id="dl-btn" href="#" target="_blank" rel="noopener">下载 Android APK</a>
    <div class="ver" id="ver">正在获取最新版本…</div>

    <div class="qr">
      <img src="qrcode.png" alt="扫码下载">
    </div>
    <div class="qr-tip">手机扫码，直达本页下载</div>

    <div class="steps">
      <b>安装步骤</b>
      <ol>
        <li>点击上方按钮下载 APK</li>
        <li>打开文件点击「安装」</li>
        <li>若提示「未知来源」，按系统引导到设置中允许即可</li>
      </ol>
    </div>
  </div>

  <footer>开源项目 · 数据本地优先 · 版本更新自动发布</footer>

<script>
(async function () {
  const btn = document.getElementById('dl-btn');
  const ver = document.getElementById('ver');
  try {
    const r = await fetch('https://api.github.com/repos/2014569061-png/ai-agent/releases/latest');
    const rel = await r.json();
    const apk = (rel.assets || []).find(a => a.name.endsWith('.apk'));
    if (apk) {
      btn.href = apk.browser_download_url;
      btn.removeAttribute('disabled');
      ver.textContent = rel.tag_name + ' · ' + (apk.size / 1048576).toFixed(1) + ' MB';
    } else {
      ver.textContent = '暂无可下载的 APK';
    }
  } catch (e) {
    btn.removeAttribute('disabled');
    btn.href = 'https://github.com/2014569061-png/ai-agent/releases/latest';
    ver.textContent = '前往 Releases 页下载';
  }
})();
</script>
</body>
</html>
