org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Keep the daemon and task outputs warm between local builds.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Flutter 3.47.2/AGP 8.13 registers a task action that captures a JDK
# ReferenceQueue; configuration-cache cannot serialize it on Java 17.
# Keep daemon/build-cache acceleration, but leave this disabled for correctness.
android.useAndroidX=true
# Keep the legacy DSL flags required by Flutter 3.47.2 and the currently
# cached plugins; AGP 9 built-in Kotlin is not yet compatible with Flutter's
# Gradle plugin in this project.
android.newDsl=false
android.builtInKotlin=false
# 各插件 Java/Kotlin JVM target 不一致（如 file_picker 11 vs 17、receive_sharing_intent 1.8 vs 21），
# 将不一致校验降级为 warning，避免构建失败。
kotlin.jvm.target.validation.mode=warning
