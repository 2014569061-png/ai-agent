name: mobile_agent
description: A mobile-first multi-provider AI Agent client.
publish_to: "none"
version: 0.8.9+91

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.5
  file_picker: ^10.3.3
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  mcp_dart: 2.4.1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  share_plus: ^12.0.2
  receive_sharing_intent: 1.8.1
  local_auth: ^3.0.2
  sentry_flutter: 9.28.0
  package_info_plus: ^9.0.1
  # P1~P3 鏂板渚濊禆锛堣瑙?NEXUS_寮€鍙戞湡鎶€鏈柟妗坃P1-P3.md 搂10锛?
  flutter_foreground_task: ^11.0.1
  flutter_local_notifications: ^18.0.1
  cryptography: ^2.7.0
  super_clipboard: 0.9.1
  workmanager: ^0.10.9
  flutter_math_fork: ^0.7.3
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  permission_handler: ^13.0.1
  archive: ^4.2.0
  crypto: ^3.0.7
  # G1 长按朗读：系统 TTS 引擎（纯平台通道插件，无需额外清单权限）。
  flutter_tts: ^4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  flutter_secure_storage_platform_interface: ^1.1.0
  path_provider_platform_interface: ^2.1.2
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true

  # Inter 仅 Latin 字形（中文走系统字体栈）；400/500 两档与 DESIGN.md 字重规范对应。
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
  assets:
    - assets/branding/nexus_mark.png
    - assets/images/bg_default.jpg
    - assets/skills/mobile-dev-basics/SKILL.md
    - assets/skills/android-build/SKILL.md
    - assets/linux/alpine-minirootfs-3.22.5-aarch64.tar.gz
    - assets/linux/libtalloc.so.2
